set_area_parameters:
  target:
    device:
      integration: ecovacs_mower
  fields:
    area_id:
      required: true
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
    mow_height_cm:
      selector:
        select:
          options:
            - "3.0"
            - "4.0"
            - "5.0"
            - "6.0"
            - "7.0"
            - "8.0"
            - "9.0"
    speed_mps:
      selector:
        select:
          options:
            - "0.40"
            - "0.45"
            - "0.50"
            - "0.55"
            - "0.60"
            - "0.65"
            - "0.70"
    obstacle_max_cm:
      selector:
        select:
          options:
            - "10"
            - "15"
            - "20"
    cutting_angle:
      selector:
        number:
          min: 0
          max: 359
          step: 1
          unit_of_measurement: "°"
          mode: slider
