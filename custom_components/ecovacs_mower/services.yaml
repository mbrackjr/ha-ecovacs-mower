mow_area:
  target:
    entity:
      domain: lawn_mower
      integration: ecovacs_mower
  fields:
    area_ids:
      required: true
      example: "[1, 3]"
      # The fallback until a mower reports its zones: area_options.py then
      # publishes a select listing them by name, with the IDs as values.
      selector:
        text:
          multiple: true
          type: number
