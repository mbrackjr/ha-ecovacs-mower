name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Kör testsviten
        run: python -m pytest tests/ -v
